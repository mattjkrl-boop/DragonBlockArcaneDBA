# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Version policy (Carter, Nov 1, 2026): 26.2 is the support FLOOR, not a pin.
# The build compiles against the floor so one jar serves 26.2 and up;
# fabric.mod.json declares "minecraft": ">=26.2". Each new Minecraft release
# or snapshot gets a port pass: bump these floor versions only when the floor
# itself moves, and re-audit the code against the new version's APIs.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.dragonblockarcanedba

# Dependencies
fabric_api_version=0.154.2+26.2
geckolib_version=5.5.3
